# ==========================================================================
# Configuración de Nginx para la tienda (servidor Ubuntu con PHP 8.3-FPM).
# Se copia a /etc/nginx/sites-available/tienda y se activa con un enlace en
# /etc/nginx/sites-enabled/. Cambia "midominio.com" y la ruta del proyecto.
# La guía de publicación explica cada paso.
# ==========================================================================

# --- Límites de visitas por minuto (protección contra abusos y robots) ---
# Estas dos líneas van FUERA del bloque "server" (en este mismo archivo está bien).
# General: 10 páginas por segundo por persona, con margen para ráfagas normales.
limit_req_zone $binary_remote_addr zone=tienda_general:10m rate=10r/s;
# Entrada al panel: 10 intentos por minuto por persona.
limit_req_zone $binary_remote_addr zone=tienda_login:10m rate=10r/m;
# Cuando alguien se pasa del límite, recibe "429 Demasiadas solicitudes".
limit_req_status 429;

server {
    listen 80;
    server_name midominio.com www.midominio.com;

    root /var/www/tienda/public;
    index index.php;
    charset utf-8;

    # Fotos de hasta 4 MB (con un pequeño margen).
    client_max_body_size 5m;

    # No contar al servidor qué versión de Nginx usa.
    server_tokens off;

    # Límite general para toda la página.
    limit_req zone=tienda_general burst=40 nodelay;

    # Pantalla de entrar al panel: límite más estricto contra quienes prueban contraseñas.
    location = /admin/entrar {
        limit_req zone=tienda_login burst=5 nodelay;
        try_files $uri /index.php?$query_string;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Archivos estáticos: que el navegador los guarde un buen tiempo.
    # (app.css y app.js llevan ?v=fecha, así que los cambios igual se ven al instante.)
    location ~* \.(?:css|js|woff2|webp|jpg|jpeg|png|svg|ico)$ {
        expires 30d;
        access_log off;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # Nunca mostrar archivos ocultos (.env, .git, etc.).
    location ~ /\.(?!well-known).* {
        deny all;
    }

    location ~ \.php$ {
        # Solo se ejecuta public/index.php; cualquier otro .php da 404.
        try_files $uri =404;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
    }

    error_page 404 /index.php;
}
