# Entorno para probar la tienda en tu computador (no se usa en el servidor).
name: tienda
services:
  app:
    build: ./docker
    image: tienda-php:8.3
    working_dir: /app
    volumes:
      - ./:/app
      - vendor:/app/vendor
    ports:
      - "8000:8000"
    environment:
      DB_HOST: db
    depends_on:
      - db
    command: php artisan serve --host=0.0.0.0 --port=8000
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: tienda
      POSTGRES_USER: tienda
      POSTGRES_PASSWORD: tienda
    volumes:
      - dbdata:/var/lib/postgresql/data
      - ./docker/initdb.sql:/docker-entrypoint-initdb.d/initdb.sql:ro
volumes:
  dbdata:
  vendor:
